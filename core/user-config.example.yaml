# calendar-worklog: 사용자 설정 템플릿
#
# 사용법:
# 1. 이 파일을 user-config.yaml 로 복사 (.gitignore에 등록되어 있음)
# 2. 본인 정보로 채움
# 3. AI Project/GPT의 Knowledge에 prompt.md와 함께 업로드
#    또는 채팅 시작 시 prompt.md와 함께 복붙
#
# YAML 주석은 # 로 시작합니다.

user:
  name: 홍길동
  # Slack workspace에서의 본인 user_id (검색 시 from:<@...>에 들어감)
  # 본인 Slack 프로필 → "Copy member ID"
  slack_user_id: U00000000000
  timezone: Asia/Seoul

work_hours:
  # 가장 간단한 케이스: default 한 줄
  default:
    start: "09:00"
    end: "18:00"

  # 요일별로 다른 경우 weekly 사용 (있으면 default 무시됨)
  # weekly:
  #   mon: { start: "08:00", end: "18:00" }
  #   tue: { start: "08:00", end: "18:00" }
  #   wed: { start: "08:00", end: "18:00" }
  #   thu: { start: "08:00", end: "18:00" }
  #   fri: { start: "08:00", end: "14:00" }  # 금요일 조기 퇴근

# 근태 규칙
attendance_rules:
  late_arrival:
    # 트리거 패턴 (정규식 또는 키워드)
    triggers: ["지참", "치참", "지각"]
    title_template: "지참 {HHMM}"
    # 시작 시각은 항상 정규 출근 시각 (work_hours.start)
    # 종료 시각은 실제 도착 시각
    start_from: work_hours.start
    end_from: arrival_time
    calendar: 근태

  full_day_absence:
    # 전일근태도 all-day 이벤트가 아니라 본인 출퇴근 시간 기준 시간 지정 이벤트로 등록
    triggers: ["연가", "휴가", "공가", "병가"]
    title_template: "{TYPE}"
    start_from: work_hours.start
    end_from: work_hours.end
    calendar: 근태
    all_day: false

  # 추후 추가 가능:
  # early_leave:
  #   triggers: ["조퇴", "일찍 퇴근"]
  #   ...

# 회사가 운영하는 캘린더 분류 체계
# 회사마다 다름. JI는 4개 캘린더 + priority 순위
calendars:
  과제:
    id: "c_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx@group.calendar.google.com"
    priority: 1
    description: "특정 연구과제명/산출물 (수행계획서, 보고서 등)"
  근태:
    id: "c_yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy@group.calendar.google.com"
    priority: 2
    description: "출근/지참/조퇴/연가/외출"
  업무:
    id: "c_zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz@group.calendar.google.com"
    priority: 3
    description: "일반 공적 업무, 회의 후속, 실무 응대, IT 관리"
  기타:
    id: "c_wwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww@group.calendar.google.com"
    priority: 4
    description: "분류 애매한 공식 일정 (학교 연락, 외부 모임, 스터디)"

# 회사가 전사에 공유한 읽기 전용 캘린더 (예: 전사 공식 일정 캘린더, 사내 행사 캘린더 등).
# 워크플로 2 단계 B에서 점유 시간표에만 합산하고, 본 어시스턴트는 여기에 이벤트를 만들지 않음.
# 회사가 공용 계정(예: calendar@회사도메인) primary 캘린더로 운영하면 ID가 그 이메일 그대로 나옴.
read_only_calendars: []
  # - id: "calendar@ji.re.kr"
  #   name: "제주연구원 공식 일정"
  # - id: "c_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa@group.calendar.google.com"
  #   name: "사내 행사 캘린더"

# 활동 데이터 소스
data_sources:
  slack:
    enabled: true
    # 검색 syntax 호환성 메모:
    # - Claude/ChatGPT의 Slack connector: from:<@U...> on:YYYY-MM-DD 패턴 OK
    workspace_hint: "회사 워크스페이스 이름"
    scope: public_only     # 공개 채널만 조회 (DM/비공개 제외)
    account: user          # user(현재 본인 계정) | bot(런칭 시 전용 봇 계정)

  calendar:
    # 본인 캘린더는 개인 OAuth로 조회.
    # 워크플로 5(주간 과제 보고)에서 타 구성원 캘린더가 필요하면 개인 OAuth로는 안 보이므로
    # ji-calendar-provision 방식으로 접근: 서비스계정 + Domain-wide Delegation,
    # calendar@ji.re.kr 임퍼소네이트. 각 구성원은 [과제]/[업무]/[근태]/[기타] {이름} 캘린더 소유.
    member_access: service_account   # service_account | per_user_share | none

  monday:
    enabled: true
    # 자주 보는 보드 ID (activity 우선 조회 대상)
    # monday 보드 URL의 /boards/ 뒤 숫자
    favorite_boards:
      - id: 0000000000
        name: "진행업무보드"
      - id: 0000000001
        name: "진행과제보드"

  ai_session_search:
    enabled: true
    # 로컬 코딩 에이전트 로그는 가용한 것을 모두 검색:
    # - Claude Code: ~/.claude/projects/
    # - Codex: ~/.codex/history.jsonl + ~/.codex/sessions/
    # - Antigravity: ~/.gemini/antigravity-cli/brain/*/.system_generated/logs/transcript.jsonl

# 조직 명부 — 워크플로 5(주간 과제 보고, 원장 보고용)에서 실(室) → 구성원 집계에 사용
organization:
  # 명부 출처:
  #   monday     : 전용 명부 보드(연구자별 소속실 매핑)에서 동적 조회 (권장 — 항상 최신)
  #   org_groups : ji-calendar-provision config/org_groups.json 재사용
  #   inline     : 아래 divisions에 직접 기재
  source: monday
  monday_roster:
    board_id: 0000000000                    # 연구자 소속 마스터 보드 ID
    division_column: dropdown_xxxxxxxx       # 소속(다중) 드롭다운
    role_column: dropdown_xxxxxxxx           # 역할 (부서장/PM/연구원 등)
    head_status_column: color_xxxxxxxx       # 부서장 표시 status
    person_column: multiple_person_xxxxxxxx  # monday 계정 매칭 (미가입자는 null)
  # 보고 대상 실 (없으면 전체)
  target_divisions:
    - OO연구실
  heads:
    OO연구실: 실장이름
  # 이메일 정규화 — 명부/monday가 구 도메인을 돌려줄 수 있으면 정본 도메인으로 변환.
  # (예: 직원이 신·구 도메인에 별개 계정이 있고 monday가 구 도메인 계정에 묶인 경우)
  # 캘린더 임퍼소네이트/Slack 이메일 검색 전에 정규화. Directory primaryEmail로 검증 권장.
  email_normalization:
    canonical_domain: example.re.kr
    deprecated_domains: [old.example.re.kr]
  # source: inline 일 때만 사용
  # divisions:
  #   - name: OO연구실
  #     members:
  #       - { name: 홍길동, email: hong@example.re.kr, slack_user_id: U0000, monday_user_id: 0 }

# 민감도(보안) 설정 — blacklist 모델
# 회사 연구는 기본 공개 가능. 보안 필요한 과업만 제목에 키워드로 명시·관리됨.
# 캘린더는 공개 노출(published)되므로, 아래 키워드가 제목/과제명에 있으면
# 캘린더에는 세부 내용 없이 일반화된 제목만 기재한다.
sensitivity:
  # 활동 출처(monday item명 / 일정 제목 / 과제명)에 이 중 하나라도 포함되면 민감으로 간주
  title_keywords:
    - "[보안]"
    - "대외비"
    - "비공개"
  # 민감 과업을 캘린더에 박을 때 쓸 일반화 제목 (description은 비움)
  generic_title: "[과제] 내부 검토"
  # 링크는 OAuth로 접근 통제되므로 민감 과업이라도 남겨도 무방 (열람 권한자만 접근 가능)
  keep_links_even_if_sensitive: true

# 이벤트 생성 정책
event_policy:
  unit_min_minutes: 30
  unit_max_minutes: 60
  color_id: keep_default  # "1"~"11" 지정 가능, keep_default 권장
  description_style: bullet_with_source
  # 다음 카테고리는 캘린더에 등록하지 않음
  exclude_categories:
    - 점심
    - 이동
    - 휴식
    - 개인사
  # 업무 시간 외 활동 등록 정책
  outside_work_hours:
    auto_register: false  # 자동 등록 안 함
    confirm_with_user: true  # 사용자에게 확인 후 등록

# 보고 양식
reporting:
  format: markdown_table
  columns: [시간, 활동, 캘린더, 상태]
  include_notes: true  # 추정 / 애매한 배정 등 메모 포함
  # 워크플로5 — 과제는 본인이 PM인 것만 기입. 공동연구원 참여 과제는 제외(중요 행사라도 ⭐ X).
  pm_only: true
  # 워크플로5 — 내용상 무조건 중요한 이벤트(별도 관리 목록). 중요도 컬럼이 부실해도
  # 아래 키워드가 해당 주 일정에 있으면 ⭐로 마킹.
  important_event_keywords:
    - 중간보고
    - 최종보고
    - 연구계획심사
    - 연구 종료
    - 연구 시작
